# Image references live only here (AWS Marketplace Helm rule).
image:
  repository: "709825985650.dkr.ecr.us-east-1.amazonaws.com/cf-synergies/c4c-mcp"
  tag: "1.0.2"
  pullPolicy: IfNotPresent

replicaCount: 1

# Name of an existing Secret holding the license key (free, for library updates) and the
# bearer token clients must send. Keys: license-key, auth-token. Create it before installing:
#   kubectl create secret generic c4c-mcp --from-literal=license-key=... --from-literal=auth-token=...
existingSecret: c4c-mcp

config:
  # The C4C feed (needs license-key in the Secret), or your own mirror, e.g.
  # https://<bucket>.s3.<region>.amazonaws.com/c4c (no license key; never contacts C4C).
  updateUrl: https://mcp.claudeforcompliance.com/library
  updateIntervalHours: "24"
  staleDays: "14"
  usageReport: "0"
  workspace: "0"
  # Audit log of tool calls: "off", "stdout" (your log collector) or "file" (/data/audit; use persistence).
  auditLog: "off"
  # Header your gateway sets with the user's identity, recorded in the audit log (e.g. x-user-email).
  auditUserHeader: ""

# /data holds the library (about 170 MB per version, two versions kept). emptyDir re-downloads
# the library after a pod restart (a few seconds); set persistence.enabled for a PVC instead.
persistence:
  enabled: false
  size: 5Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

serviceAccount:
  create: true
  name: ""

nodeSelector: {}
tolerations: []
affinity: {}
